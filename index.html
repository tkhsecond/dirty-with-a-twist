<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirty With a Twist — Songs</title>
<style>
:root {
  --bg:#0b0d10; --panel:#13171c; --line:#2b3138; --text:#f3f5f7;
  --muted:#9aa4ae; --accent:#e6edf3; --danger:#ff6b6b; --ok:#77d59a;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    linear-gradient(rgba(11,13,16,.72), rgba(11,13,16,.72)),
    url("background.png") center top / 500px auto repeat;
}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 4px} .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button{font:inherit}
.tab,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}
.tab.active{background:var(--accent);color:#111}
.action{font-size:12px;padding:6px 9px}
.action.remove{color:#ffd2d2}
.action.restore{color:#c8f3d6}
.action.playing{color:#d4e8ff}
.card{background:rgba(19,23,28,.50);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(1px)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:rgba(16,20,25,.70);position:sticky;top:0}
tr:last-child td{border-bottom:0}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}
.name a{font-weight:700}
.artist{color:#d5dbe0}
.link{white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;color:var(--muted);text-align:center}
.count{font-size:13px;color:var(--muted)}
.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.45}
@media (max-width:720px){
  .wrap{padding:14px}
  h1{font-size:22px}
  th,td{padding:10px 8px}
  th:nth-child(2),td:nth-child(2){width:28%}
  .link span{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Dirty With a Twist</h1>
    <div class="sub">Song list</div>
  </div>
  <div id="count" class="count"></div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="all">All Songs</button>
  <button class="tab" data-tab="playing">Playing Together</button>
  <button class="tab" data-tab="removed">Removed Songs</button>
</div>

<div class="card">
<table>
<thead><tr><th>Name</th><th>Artist</th><th>Bass Tab Video</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" style="display:none"></div>
</div>
<div class="note">
  Changes are saved in this browser. Song titles open Apple Music. “Bass lesson ✓” means I have selected a specific learning video; “Find bass video” is still a targeted YouTube search awaiting curation.
</div>
</div>

<script>
const seed = [{"id":"s001","name":"Fade Away","artist":"V-Roys","apple":"https://music.apple.com/us/search?term=Fade+Away+V-Roys","bass":"https://www.youtube.com/results?search_query=Fade+Away+V-Roys+bass+tab","bass_status":"search"},{"id":"s002","name":"Boys Don't Cry (LP Version)","artist":"The Cure","apple":"https://music.apple.com/us/search?term=Boys+Don%27t+Cry+%28LP+Version%29+The+Cure","bass":"https://www.youtube.com/results?search_query=Boys+Don%27t+Cry+%28LP+Version%29+The+Cure+bass+tab","bass_status":"search"},{"id":"s003","name":"Another Nail In My Heart","artist":"Squeeze","apple":"https://music.apple.com/us/search?term=Another+Nail+In+My+Heart+Squeeze","bass":"https://www.youtube.com/results?search_query=Another+Nail+In+My+Heart+Squeeze+bass+tab","bass_status":"search"},{"id":"s004","name":"Nothing from Nothing","artist":"Billy Preston","apple":"https://music.apple.com/us/search?term=Nothing+from+Nothing+Billy+Preston","bass":"https://www.youtube.com/results?search_query=Nothing+from+Nothing+Billy+Preston+bass+tab","bass_status":"search"},{"id":"s005","name":"Take the Power Back","artist":"Rage Against the Machine","apple":"https://music.apple.com/us/search?term=Take+the+Power+Back+Rage+Against+the+Machine","bass":"https://www.youtube.com/watch?v=aOOhMDhId58","bass_status":"curated"},{"id":"s006","name":"Root Down","artist":"Beastie Boys","apple":"https://music.apple.com/us/search?term=Root+Down+Beastie+Boys","bass":"https://www.youtube.com/results?search_query=Root+Down+Beastie+Boys+bass+tab","bass_status":"search"},{"id":"s007","name":"Stray Cat Strut","artist":"Stray Cats","apple":"https://music.apple.com/us/search?term=Stray+Cat+Strut+Stray+Cats","bass":"https://www.youtube.com/results?search_query=Stray+Cat+Strut+Stray+Cats+bass+tab","bass_status":"search"},{"id":"s008","name":"Rosanna","artist":"Toto","apple":"https://music.apple.com/us/search?term=Rosanna+Toto","bass":"https://www.youtube.com/results?search_query=Rosanna+Toto+bass+tab","bass_stat +Remain+Old+97%27s+bass+tab","bass_status":"search"},{"id":"s017","name":"Don't Dream It's Over","artist":"Crowded House","apple":"https://music.apple.com/us/search?term=Don%27t+Dream+It%27s+Over+Crowded+House","bass":"https://www.youtube.com/results?search_query=Don%27t+Dream+It%27s+Over+Crowded+House+bass+tab","bass_status":"search"},{"id":"s018","name":"It Was a Good Day","artist":"Ice Cube","apple":"https://music.apple.com/us/search?term=It+Was+a+Good+Day+Ice+Cube","bass":"https://www.youtube.com/results?search_query=It+Was+a+Good+Day+Ice+Cube+bass+tab","bass_status":"search"},{"id":"s019","name":"Nuthin' But A \"G\" Thang","artist":"Dr. Dre & Snoop Dogg","apple":"https://music.apple.com/us/search?term=Nuthin%27+But+A+%22G%22+Thang+Dr.+Dre+%26+Snoop+Dogg","bass":"https://www.youtube.com/results?search_query=Nuthin%27+But+A+%22G%22+Thang+Dr.+Dre+%26+Snoop+Dogg+bass+tab","bass_status":"search"},{"id":"s020","name":"Ain't No Sunshine","artist":"Bill Withers","apple":"https://music.apple.com/us/search?term=Ain%27t+No+Sunshine+Bill+Withers","bass":"https://www.youtube.com/results?search_query=Ain%27t+No+Sunshine+Bill+Withers+bass+tab","bass_status":"search"},{"id":"s021","name":"Folsom Prison Blues","artist":"Johnny Cash","apple":"https://music.apple.com/us/search?term=Folsom+Prison+Blues+Johnny+Cash","bass":"https://www.youtube.com/results?search_query=Folsom+Prison+Blues+Johnny+Cash+bass+tab","bass_status":"search"},{"id":"s022","name":"Out of My Head","artist":"Fastball","apple":"https://music.apple.com/us/search?term=Out+of+My+Head+Fastball","bass":"https://www.youtube.com/results?search_query=Out+of+My+Head+Fastball+bass+tab","bass_status":"search"},{"id":"s023","name":"Secret Agent Man","artist":"Johnny Rivers","apple":"https://music.apple.com/us/search?term=Secret+Agent+Man+Johnny+Rivers","bass":"https://www.youtube.com/results?search_query=Secret+Agent+Man+Johnny+Rivers+bass+tab","bass_status":"search"},{"id":"s024","name":"Tennessee Whiskey","artist":"Chris Stapleton","apple":"https://music.apple.com/us/search?term=Tennessee+Whiskey+Chris+Stapleton","bass":"https://www.youtube.com/results?search_query=Tennessee+Whiskey+Chris+Stapleton+bass+tab","bass_status":"search"},{"id":"s025","name":"(What's So Funny 'Bout) Peace, Love and Understanding","artist":"Elvis Costello & The Attractions","apple":"https://music.apple.com/us/search?term=%28What%27s+So+Funny+%27Bout%29+Peace%2C+Love+and+Understanding+Elvis+Costello+%26+The+Attractions","bass":"https://www.youtube.com/results?search_query=%28What%27s+So+Funny+%27Bout%29+Peace%2C+Love+and+Understanding+Elvis+Costello+%26+The+Attractions+bass+tab","bass_status":"search"},{"id":"s026","name":"With a Little Help from My Friends","artist":"The Beatles","apple":"https://music.apple.com/us/search?term=With+a+Little+Help+from+My+Friends+The+Beatles","bass":"https://www.youtube.com/results?search_query=With+a+Little+Help+from+My+Friends+The+Beatles+bass+tab","bass_status":"search"},{"id":"s027","name":"Mercy, Mercy","artist":"The Rolling Stones","apple":"https://music.apple.com/us/search?term=Mercy%2C+Mercy+The+Rolling+Stones","bass":"https://www.youtube.com/results?search_query=Mercy%2C+Mercy+The+Rolling+Stones+bass+tab","bass_status":"search"},{"id":"s028","name":"BridgeBuilder","artist":"JD McPherson","apple":"https://music.apple.com/us/search?term=BridgeBuilder+JD+McPherson","bass":"https://www.youtube.com/results?search_query=BridgeBuilder+JD+McPherson+bass+tab","bass_status":"search"},{"id":"s029","name":"The House Is Rockin'","artist":"Stevie Ray Vaughan & Double Trouble","apple":"https://music.apple.com/us/search?term=The+House+Is+Rockin%27+Stevie+Ray+Vaughan+%26+Double+Trouble","bass":"https://www.youtube.com/results?search_query=The+House+Is+Rockin%27+Stevie+Ray+Vaughan+%26+Double+Trouble+bass+tab","bass_status":"search"},{"id":"s030","name":"Proud Mary","artist":"Creedence Clearwater Revival","apple":"https://music.apple.com/us/search?term=Proud+Mary+Creedence+Clearwater+Revival","bass":"https://www.youtube.com/results?search_query=Proud+Mary+Creedence+Clearwater+Revival+bass+tab","bass_status":"search"},{"id":"s031","name":"Ridin' in My Car","artist":"NRBQ","apple":"https://music.apple.com/us/search?term=Ridin%27+in+My+Car+NRBQ","bass":"https://www.youtube.com/results?search_query=Ridin%27+in+My+Car+NRBQ+bass+tab","bass_status":"search"},{"id":"s032","name":"Bring It On Home to Me","artist":"Sam Cooke","apple":"https://music.apple.com/us/search?term=Bring+It+On+Home+to+Me+Sam+Cooke","bass":"https://www.youtube.com/results?search_query=Bring+It+On+Home+to+Me+Sam+Cooke+bass+tab","bass_status":"search"},{"id":"s033","name":"Running on Empty","artist":"Jackson Browne","apple":"https://music.apple.com/us/search?term=Running+on+Empty+Jackson+Browne","bass":"https://www.youtube.com/results?search_query=Running+on+Empty+Jackson+Browne+bass+tab","bass_status":"search"},{"id":"s034","name":"Black Coffee in Bed","artist":"Squeeze","apple":"https://music.apple.com/us/search?term=Black+Coffee+in+Bed+Squeeze","bass":"https://www.youtube.com/results?search_query=Black+Coffee+in+Bed+Squeeze+bass+tab","bass_status":"search"},{"id":"s035","name":"Say It Ain't So","artist":"Weezer","apple":"https://music.apple.com/us/search?term=Say+It+Ain%27t+So+Weezer","bass":"https://www.youtube.com/results?search_query=Say+It+Ain%27t+So+Weezer+bass+tab","bass_status":"search"}];
const KEY = "dwat-songs-v1";
let state = JSON.parse(localStorage.getItem(KEY) || "null") || { all: [], playing: [], removed: [], removedFrom: {} };
const known = new Set([...(state.all||[]), ...(state.playing||[]), ...(state.removed||[])]);
seed.forEach(s => { if (!known.has(s.id)) state.all.push(s.id); });
state.all = state.all || []; state.playing = state.playing || []; state.removed = state.removed || []; state.removedFrom = state.removedFrom || {};
localStorage.setItem(KEY, JSON.stringify(state));
let current = "all";
const byId = Object.fromEntries(seed.map(s=>[s.id,s]));
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }
function addPlaying(id){ if(!state.playing.includes(id)) state.playing.push(id); state.all = state.all.filter(x=>x!==id); state.removed = state.removed.filter(x=>x!==id); save(); }
function removeFrom(list,id){ state[list]=state[list].filter(x=>x!==id); state.removedFrom[id]=list; if(!state.removed.includes(id)) state.removed.push(id); save(); }
function restore(id){ const dest=state.removedFrom[id]||"all"; if(!state[dest].includes(id)) state[dest].push(id); state.removed=state.removed.filter(x=>x!==id); delete state.removedFrom[id]; save(); }
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===current));
  const ids=state[current]||[]; const tbody=document.getElementById("rows"); const empty=document.getElementById("empty");
  tbody.innerHTML=""; empty.style.display=ids.length?"none":"block";
  empty.textContent=current==="playing"?"No songs have been added to Playing Together yet.":current==="removed"?"No removed songs.":"No songs.";
  ids.forEach(id=>{
    const s=byId[id]; if(!s) return; const tr=document.createElement("tr"); let actions="";
    if(current==="all") actions=`<button class="action playing" onclick="addPlaying('${id}')">Add to Playing</button><button class="action remove" onclick="removeFrom('all','${id}')">Remove</button>`;
    else if(current==="playing") actions=`<button class="action remove" onclick="removeFrom('playing','${id}')">Remove</button>`;
    else actions=`<button class="action restore" onclick="restore('${id}')">Restore</button>`;
    tr.innerHTML=`<td class="name"><a href="${s.apple}" target="_blank" rel="noopener">${s.name}</a></td><td class="artist">${s.artist}</td><td class="link"><a href="${s.bass}" target="_blank" rel="noopener">${s.bass_status==="curated"?"Bass lesson":"Find bass video"} <span>${s.bass_status==="curated"?"✓":"↗"}</span></a></td><td><div class="actions">${actions}</div></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("count").textContent=`${ids.length} song${ids.length===1?"":"s"}`;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.tab;render();}));
render();
</script>
</body>
</html>
