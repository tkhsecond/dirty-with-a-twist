<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirty With a Twist — Songs</title>
<style>
:root {
  --bg:#0b0d10; --panel:#13171c; --line:#2b3138; --text:#f3f5f7;
  --muted:#9aa4ae; --accent:#e6edf3; --danger:#ff6b6b; --ok:#77d59a;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    linear-gradient(rgba(11,13,16,.72), rgba(11,13,16,.72)),
    url("background.png") center top / 500px auto repeat;
}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 4px} .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button{font:inherit}
.tab,.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}
.tab.active{background:var(--accent);color:#111}
.action{font-size:12px;padding:6px 9px}
.action.remove{color:#ffd2d2}
.action.restore{color:#c8f3d6}
.action.playing{color:#d4e8ff}
.card{background:rgba(19,23,28,.50);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(1px)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:rgba(16,20,25,.70);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
.sort-indicator{font-size:10px;margin-left:4px}
tr:last-child td{border-bottom:0}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}
.name a{font-weight:700}
.artist{color:#d5dbe0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;color:var(--muted);text-align:center}
.count{font-size:13px;color:var(--muted)}
.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.45}
@media (max-width:720px){
  .wrap{padding:14px}
  h1{font-size:22px}
  th,td{padding:7px 8px}
  th:nth-child(2),td:nth-child(2){width:28%}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Dirty With a Twist</h1>
    <div class="sub">Song list</div>
  </div>
  <div id="count" class="count"></div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="all">All Songs</button>
  <button class="tab" data-tab="playing">Playing Together</button>
  <button class="tab" data-tab="removed">Removed Songs</button>
</div>

<div class="card">
<table>
<thead><tr><th class="sortable" data-sort="name">Name <span class="sort-indicator"></span></th><th class="sortable" data-sort="artist">Artist <span class="sort-indicator"></span></th><th>Action</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" style="display:none"></div>
</div>
<div class="note">
  Songs can be in only one list at a time. Song titles open Apple Music.
</div>
</div>

<script>
const seed = [{"id":"s001","name":"Fade Away","artist":"V-Roys","apple":"https://music.apple.com/us/search?term=Fade+Away+V-Roys","bass":"https://www.youtube.com/results?search_query=Fade+Away+V-Roys+bass+tab","bass_status":"search"},{"id":"s002","name":"Boys Don't Cry (LP Version)","artist":"The Cure","apple":"https://music.apple.com/us/song/286659245","bass":"https://www.youtube.com/results?search_query=Boys+Don%27t+Cry+%28LP+Version%29+The+Cure+bass+tab","bass_status":"search"},{"id":"s003","name":"Another Nail In My Heart","artist":"Squeeze","apple":"https://music.apple.com/us/song/1446091637","bass":"https://www.youtube.com/results?search_query=Another+Nail+In+My+Heart+Squeeze+bass+tab","bass_status":"search"},{"id":"s004","name":"Nothing from Nothing","artist":"Billy Preston","apple":"https://music.apple.com/us/song/1444088298","bass":"https://www.youtube.com/results?search_query=Nothing+from+Nothing+Billy+Preston+bass+tab","bass_status":"search"},{"id":"s005","name":"Take the Power Back","artist":"Rage Against the Machine","apple":"https://music.apple.com/us/song/191450956","bass":"https://www.youtube.com/watch?v=aOOhMDhId58","bass_status":"curated"},{"id":"s006","name":"Root Down","artist":"Beastie Boys","apple":"https://music.apple.com/us/song/716575689","bass":"https://www.youtube.com/results?search_query=Root+Down+Beastie+Boys+bass+tab","bass_status":"search"},{"id":"s007","name":"Stray Cat Strut","artist":"Stray Cats","apple":"https://music.apple.com/us/song/1443118263","bass":"https://www.youtube.com/results?search_query=Stray+Cat+Strut+Stray+Cats+bass+tab","bass_status":"search"},{"id":"s008","name":"Rosanna","artist":"Toto","apple":"https://music.apple.com/us/song/1744619001","bass":"https://www.youtube.com/results?search_query=Rosanna+Toto+bass+tab","bass_status":"search"},{"id":"s009","name":"Send Me On My Way","artist":"Rusted Root","apple":"https://music.apple.com/us/song/1440931590","bass":"https://www.youtube.com/results?search_query=Send+Me+On+ ://music.apple.com/us/song/1440858804","bass":"https://www.youtube.com/results?search_query=It+Was+a+Good+Day+Ice+Cube+bass+tab","bass_status":"search"},{"id":"s019","name":"Nuthin' But A \"G\" Thang","artist":"Dr. Dre & Snoop Dogg","apple":"https://music.apple.com/us/search?term=Nuthin%27+But+A+%22G%22+Thang+Dr.+Dre+%26+Snoop+Dogg","bass":"https://www.youtube.com/results?search_query=Nuthin%27+But+A+%22G%22+Thang+Dr.+Dre+%26+Snoop+Dogg+bass+tab","bass_status":"search"},{"id":"s020","name":"Ain't No Sunshine","artist":"Bill Withers","apple":"https://music.apple.com/us/song/293521573","bass":"https://www.youtube.com/results?search_query=Ain%27t+No+Sunshine+Bill+Withers+bass+tab","bass_status":"search"},{"id":"s021","name":"Folsom Prison Blues","artist":"Johnny Cash","apple":"https://music.apple.com/us/song/1354858870","bass":"https://www.youtube.com/results?search_query=Folsom+Prison+Blues+Johnny+Cash+bass+tab","bass_status":"search"},{"id":"s022","name":"Out of My Head","artist":"Fastball","apple":"https://music.apple.com/us/song/1440905572","bass":"https://www.youtube.com/results?search_query=Out+of+My+Head+Fastball+bass+tab","bass_status":"search"},{"id":"s023","name":"Secret Agent Man","artist":"Johnny Rivers","apple":"https://music.apple.com/us/song/724562145","bass":"https://www.youtube.com/results?search_query=Secret+Agent+Man+Johnny+Rivers+bass+tab","bass_status":"search"},{"id":"s024","name":"Tennessee Whiskey","artist":"Chris Stapleton","apple":"https://music.apple.com/us/song/1527144696","bass":"https://www.youtube.com/results?search_query=Tennessee+Whiskey+Chris+Stapleton+bass+tab","bass_status":"search"},{"id":"s025","name":"(What's So Funny 'Bout) Peace, Love and Understanding","artist":"Elvis Costello & The Attractions","apple":"https://music.apple.com/us/song/1543779936","bass":"https://www.youtube.com/results?search_query=%28What%27s+So+Funny+%27Bout%29+Peace%2C+Love+and+Understanding+Elvis+Costello+%26+The+Attractions+bass+tab","bass_status":"search"},{"id":"s026","name":"With a Little Help from My Friends","artist":"The Beatles","apple":"https://music.apple.com/us/song/with-a-little-help-from-my-friends/1441164851","bass":"https://www.youtube.com/results?search_query=With+a+Little+Help+from+My+Friends+The+Beatles+bass+tab","bass_status":"search"},{"id":"s027","name":"Mercy, Mercy","artist":"The Rolling Stones","apple":"https://music.apple.com/us/song/1440743532","bass":"https://www.youtube.com/results?search_query=Mercy%2C+Mercy+The+Rolling+Stones+bass+tab","bass_status":"search"},{"id":"s028","name":"BridgeBuilder","artist":"JD McPherson","apple":"https://music.apple.com/us/search?term=BridgeBuilder+JD+McPherson","bass":"https://www.youtube.com/results?search_query=BridgeBuilder+JD+McPherson+bass+tab","bass_status":"search"},{"id":"s029","name":"The House Is Rockin'","artist":"Stevie Ray Vaughan & Double Trouble","apple":"https://music.apple.com/us/song/266390192","bass":"https://www.youtube.com/results?search_query=The+House+Is+Rockin%27+Stevie+Ray+Vaughan+%26+Double+Trouble+bass+tab","bass_status":"search"},{"id":"s030","name":"Proud Mary","artist":"Creedence Clearwater Revival","apple":"https://music.apple.com/us/song/1440946827","bass":"https://www.youtube.com/results?search_query=Proud+Mary+Creedence+Clearwater+Revival+bass+tab","bass_status":"search"},{"id":"s031","name":"Ridin' in My Car","artist":"NRBQ","apple":"https://music.apple.com/us/song/1438040607","bass":"https://www.youtube.com/results?search_query=Ridin%27+in+My+Car+NRBQ+bass+tab","bass_status":"search"},{"id":"s032","name":"Bring It On Home to Me","artist":"Sam Cooke","apple":"https://music.apple.com/us/song/299550277","bass":"https://www.youtube.com/results?search_query=Bring+It+On+Home+to+Me+Sam+Cooke+bass+tab","bass_status":"search"},{"id":"s033","name":"Running on Empty","artist":"Jackson Browne","apple":"https://music.apple.com/us/song/1466749712","bass":"https://www.youtube.com/results?search_query=Running+on+Empty+Jackson+Browne+bass+tab","bass_status":"search"},{"id":"s034","name":"Black Coffee in Bed","artist":"Squeeze","apple":"https://music.apple.com/us/song/1443994437","bass":"https://www.youtube.com/results?search_query=Black+Coffee+in+Bed+Squeeze+bass+tab","bass_status":"search"},{"id":"s035","name":"Say It Ain't So","artist":"Weezer","apple":"https://music.apple.com/us/song/1440870181","bass":"https://www.youtube.com/results?search_query=Say+It+Ain%27t+So+Weezer+bass+tab","bass_status":"search"},{"id":"s036","name":"Beer Drinkers & Hell Raisers","artist":"ZZ Top","apple":"https://music.apple.com/us/song/1728071600","bass":"https://www.youtube.com/results?search_query=Beer+Drinkers+%26+Hell+Raisers+ZZ+Top+bass+tab","bass_status":"search"},{"id":"s037","name":"I Need to Know","artist":"Tom Petty and the Heartbreakers","apple":"https://music.apple.com/us/song/1755217577","bass":"https://www.youtube.com/results?search_query=I+Need+to+Know+Tom+Petty+and+the+Heartbreakers+bass+tab","bass_status":"search"},{"id":"s038","name":"I'm the Man","artist":"Joe Jackson","apple":"https://music.apple.com/us/song/1440904658","bass":"https://www.youtube.com/results?search_query=I'm+the+Man+Joe+Jackson+bass+tab","bass_status":"search"},{"id":"s039","name":"Precious","artist":"Pretenders","apple":"https://music.apple.com/us/search?term=Precious+Pretenders","bass":"https://www.youtube.com/results?search_query=Precious+Pretenders+bass+tab","bass_status":"search"},{"id":"s040","name":"Go with the Flow","artist":"Queens of the Stone Age","apple":"https://music.apple.com/us/song/1440759940","bass":"https://www.youtube.com/results?search_query=Go+with+the+Flow+Queens+of+the+Stone+Age+bass+tab","bass_status":"search"},{"id":"s041","name":"Don't Ya Stop","artist":"The Cars","apple":"https://music.apple.com/us/search?term=Don't+Ya+Stop+The+Cars","bass":"https://www.youtube.com/results?search_query=Don't+Ya+Stop+The+Cars+bass+tab","bass_status":"search"},{"id":"s042","name":"Already Gone","artist":"Eagles","apple":"https://music.apple.com/us/song/635788752","bass":"https://www.youtube.com/results?search_query=Already+Gone+Eagles+bass+tab","bass_status":"search"},{"id":"s043","name":"You Got Lucky","artist":"Tom Petty and the Heartbreakers","apple":"https://music.apple.com/us/song/1440855941","bass":"https://www.youtube.com/results?search_query=You+Got+Lucky+Tom+Petty+and+the+Heartbreakers+bass+tab","bass_status":"search"},{"id":"s044","name":"Lawyers, Guns and Money","artist":"Warren Zevon","apple":"https://music.apple.com/us/song/1048476316","bass":"https://www.youtube.com/results?search_query=Lawyers%2C+Guns+and+Money+Warren+Zevon+bass+tab","bass_status":"search"},{"id":"s045","name":"Someday","artist":"The Strokes","apple":"https://music.apple.com/us/song/266376993","bass":"https://www.youtube.com/results?search_query=Someday+The+Strokes+bass+tab","bass_status":"search"},{"id":"s046","name":"Rock 'n' Roll Star","artist":"Oasis","apple":"https://music.apple.com/us/song/1517506686","bass":"https://www.youtube.com/results?search_query=Rock+'n'+Roll+Star+Oasis+bass+tab","bass_status":"search"},{"id":"s047","name":"And She Was","artist":"Talking Heads","apple":"https://music.apple.com/us/song/124904840","bass":"https://www.youtube.com/results?search_query=And+She+Was+Talking+Heads+bass+tab","bass_status":"search"},{"id":"s048","name":"Cities","artist":"Talking Heads","apple":"https://music.apple.com/us/song/300965541","bass":"https://www.youtube.com/results?search_query=Cities+Talking+Heads+bass+tab","bass_status":"search"},{"id":"s049","name":"Last Nite","artist":"The Strokes","apple":"https://music.apple.com/us/song/266377010","bass":"https://www.youtube.com/results?search_query=Last+Nite+The+Strokes+bass+tab","bass_status":"search"}];
const SHARED_PLAYING = ["s007","s011","s021","s024","s031","s020"];
const SHARED_REMOVED = [];
const KEY = "dwat-songs-v2";

function freshState() {
  return {
    playing: [...SHARED_PLAYING],
    removed: [...SHARED_REMOVED],
    all: seed.map(s=>s.id).filter(id => !SHARED_PLAYING.includes(id) && !SHARED_REMOVED.includes(id))
  };
}

let state = JSON.parse(localStorage.getItem(KEY) || "null") || freshState();

// Keep the three lists mutually exclusive and add newly published songs to All Songs.
const validIds = new Set(seed.map(s=>s.id));
state.playing = (state.playing || []).filter(id => validIds.has(id));
state.removed = (state.removed || []).filter(id => validIds.has(id) && !state.playing.includes(id));
state.all = (state.all || []).filter(id => validIds.has(id) && !state.playing.includes(id) && !state.removed.includes(id));
const assigned = new Set([...state.all, ...state.playing, ...state.removed]);
seed.forEach(s => { if (!assigned.has(s.id)) state.all.push(s.id); });

let current = "all";
let sortKey = "name";
let sortDir = "asc";
const byId = Object.fromEntries(seed.map(s=>[s.id,s]));

function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}

function moveToPlaying(id){
  state.all = state.all.filter(x=>x!==id);
  state.removed = state.removed.filter(x=>x!==id);
  if(!state.playing.includes(id)) state.playing.push(id);
  save();
}

function moveToAll(id){
  state.playing = state.playing.filter(x=>x!==id);
  state.removed = state.removed.filter(x=>x!==id);
  if(!state.all.includes(id)) state.all.push(id);
  save();
}

function removeSong(id){
  state.all = state.all.filter(x=>x!==id);
  state.playing = state.playing.filter(x=>x!==id);
  if(!state.removed.includes(id)) state.removed.push(id);
  save();
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===current));
  const ids=[...(state[current]||[])].sort((a,b)=>{
    const av=(byId[a]?.[sortKey]||"").toLocaleLowerCase();
    const bv=(byId[b]?.[sortKey]||"").toLocaleLowerCase();
    const cmp=av.localeCompare(bv);
    return sortDir==="asc" ? cmp : -cmp;
  });
  const tbody=document.getElementById("rows"); const empty=document.getElementById("empty");
  tbody.innerHTML=""; empty.style.display=ids.length?"none":"block";
  empty.textContent=current==="playing"?"No songs have been added to Playing Together yet.":current==="removed"?"No removed songs.":"No songs.";
  ids.forEach(id=>{
    const s=byId[id]; if(!s) return;
    const tr=document.createElement("tr");
    let actions="";
    if(current==="all") {
      actions=`<button class="action playing" onclick="moveToPlaying('${id}')">Add to Playing</button>
               <button class="action remove" onclick="removeSong('${id}')">Remove</button>`;
    } else if(current==="playing") {
      actions=`<button class="action" onclick="moveToAll('${id}')">Move to All Songs</button>
               <button class="action remove" onclick="removeSong('${id}')">Remove</button>`;
    } else {
      actions=`<button class="action restore" onclick="moveToAll('${id}')">Restore to All Songs</button>`;
    }
    tr.innerHTML=`<td class="name"><a href="${s.apple}">${s.name}</a></td>
                  <td class="artist">${s.artist}</td>
                  <td><div class="actions">${actions}</div></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("count").textContent=`${ids.length} song${ids.length===1?"":"s"}`;
  document.querySelectorAll("th.sortable").forEach(th=>{
    const indicator=th.querySelector(".sort-indicator");
    indicator.textContent = th.dataset.sort===sortKey ? (sortDir==="asc" ? "▲" : "▼") : "";
  });
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.tab;render();}));
document.querySelectorAll("th.sortable").forEach(th=>th.addEventListener("click",()=>{
  const key=th.dataset.sort;
  if(sortKey===key) sortDir = sortDir==="asc" ? "desc" : "asc";
  else { sortKey=key; sortDir="asc"; }
  render();
}));
render();
</script>
</body>
</html>
